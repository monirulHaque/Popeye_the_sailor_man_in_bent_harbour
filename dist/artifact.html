<title>Bent Harbor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Holtwood+One+SC&family=Luckiest+Guy&family=Mouse+Memoirs&family=Special+Elite&display=swap">
<style>
  /* layout: one print of a comic panel lying on a dark press table; controls tucked under it */
  :root { --table: #15130f; --table-2: #221f19; --paper: #efe2c0; --ink: #1d1a16; --accent: #e2a52c; --muted: #9a8f74; color-scheme: dark;
    --font-cap: "Mouse Memoirs", "Arial Narrow", Impact, sans-serif; --font-type: "Special Elite", "Courier New", monospace; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(120% 90% at 50% 40%, var(--table-2), var(--table)); color: var(--paper); box-sizing: border-box; overflow: hidden;
    display: flex; flex-direction: column; gap: 8px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-family: var(--font-type); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #stage { flex: 1; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; background: var(--paper); border-radius: 2px; box-shadow: 0 2px 0 #000, 0 14px 44px rgba(0, 0, 0, .65); touch-action: none; max-width: 100%; }
  #keys { margin: 0; text-align: center; font-size: 12.5px; letter-spacing: .04em; color: var(--muted); }
  #keys b { color: var(--accent); font-weight: normal; }
  #touch { position: fixed; inset: 0; pointer-events: none; }
  #touch > * { pointer-events: auto; position: absolute; touch-action: none; }
  #tc-stick { left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 124px; height: 124px; border-radius: 50%; background: rgba(239, 226, 192, .14); border: 3px solid rgba(239, 226, 192, .5); }
  #tc-nub { position: absolute; left: 37px; top: 37px; width: 50px; height: 50px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); pointer-events: none; }
  .tc-btn { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--ink); font: 24px var(--font-cap); letter-spacing: .06em; color: var(--ink); box-shadow: 0 4px 0 #000; }
  .tc-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
  .tc-btn:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  #tc-punch { right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); background: #c9442c; color: var(--paper); }
  #tc-jump { right: calc(max(18px, env(safe-area-inset-right, 0px)) + 96px); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--accent); }
  #tc-pause { right: max(18px, env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); width: 52px; height: 40px; border-radius: 6px; background: var(--paper); font-size: 17px; box-shadow: 0 3px 0 #000; }
  @media (pointer: coarse) { #keys { display: none; } }
</style>
<div id="stage"><canvas id="game" width="1280" height="720" aria-label="Bent Harbor, a dockside beat-'em-up. Keyboard: A and D move, Space jumps, J punches."></canvas></div>
<p id="keys"><b>A D</b> move &nbsp;·&nbsp; <b>SPACE</b> jump &nbsp;·&nbsp; <b>J</b> punch (hold to wind up, <b>↑ ↓</b> to aim) &nbsp;·&nbsp; <b>ESC</b> pause &nbsp;·&nbsp; <b>M</b> mute &nbsp;·&nbsp; gamepad supported</p>
<div id="touch" hidden>
  <div id="tc-stick"><div id="tc-nub"></div></div>
  <button class="tc-btn" id="tc-jump" type="button">JUMP</button>
  <button class="tc-btn" id="tc-punch" type="button">SOCK</button>
  <button class="tc-btn" id="tc-pause" type="button">II</button>
</div>
<script>
(function () {
'use strict';
// ===== 00_core.js
// ───────────────────────────── core: constants, math, palette, input
const W = 1280, H = 720, TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const pick = (a) => a[(Math.random() * a.length) | 0];
const hypot = Math.hypot, abs = Math.abs, sin = Math.sin, cos = Math.cos, sign = Math.sign;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const outBack = (t) => { const c = 2.2; t = clamp(t, 0, 1) - 1; return 1 + (c + 1) * t * t * t + c * t * t; };
const outCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const money = (n) => '$' + Math.round(n).toLocaleString('en-US');

// Four-colour press palette: one paper, one ink, a handful of spot colours.
const C = {
  paper: '#efe2c0', paperDk: '#dccb9f', white: '#fbf6e4', ink: '#1d1a16',
  teal: '#2c6e73', tealLt: '#8dbcb0', sea: '#3d8589',
  red: '#c9442c', redDk: '#8f2c1c', mustard: '#e2a52c', cream: '#f4dc9a',
  green: '#4c9a3b', greenLt: '#a4d466', wood: '#c9995a', woodDk: '#9a6d3a',
  steel: '#8b9a9c', steelDk: '#566769', navy: '#2a4560', brick: '#b8573d', skin: '#f0b98a', skin2: '#e3a06f',
};
const FONT = {
  sfx: '"Luckiest Guy", Impact, "Arial Black", sans-serif',
  sign: '"Holtwood One SC", Rockwell, "Rockwell Extra Bold", Georgia, serif',
  cap: '"Mouse Memoirs", "Arial Narrow", "Helvetica Neue Condensed", Impact, sans-serif',
  type: '"Special Elite", "Courier New", Courier, monospace',
};

const Store = {
  get(k, d) { try { const v = localStorage.getItem('bentharbor.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('bentharbor.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

// ───────────────────────────── input (keyboard + gamepad + touch)
const Input = (() => {
  const keys = new Set();
  const GAME_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyJ', 'KeyK', 'KeyZ', 'KeyX', 'Enter', 'Escape', 'KeyP', 'KeyM']);
  const st = { x: 0, y: 0, jump: false, punch: false, jumpP: false, punchP: false, punchR: false, pauseP: false, confirmP: false, muteP: false, upP: false, downP: false, leftP: false, rightP: false, any: false };
  const prev = {};
  const touch = { x: 0, y: 0, jump: false, punch: false, pause: false, active: false };
  let onGesture = null, padSeen = false;
  addEventListener('keydown', (e) => {
    if (GAME_KEYS.has(e.code)) e.preventDefault();
    keys.add(e.code);
    if (onGesture) onGesture();
  });
  addEventListener('keyup', (e) => keys.delete(e.code));
  addEventListener('blur', () => keys.clear());
  const k = (...c) => c.some((x) => keys.has(x));
  function poll() {
    let x = 0, y = 0;
    if (k('ArrowLeft', 'KeyA')) x -= 1;
    if (k('ArrowRight', 'KeyD')) x += 1;
    if (k('ArrowUp', 'KeyW')) y -= 1;
    if (k('ArrowDown', 'KeyS')) y += 1;
    let jump = k('Space', 'KeyK', 'KeyX'), punch = k('KeyJ', 'KeyZ');
    let pause = k('Escape', 'KeyP'), confirm = k('Enter', 'Space', 'KeyJ', 'KeyZ'), mute = k('KeyM');
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) {
      if (!gp || !gp.connected) continue;
      padSeen = true;
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0, b = (i) => gp.buttons[i] && gp.buttons[i].pressed;
      if (abs(ax) > 0.35) x += sign(ax);
      if (abs(ay) > 0.45) y += sign(ay);
      if (b(14)) x -= 1; if (b(15)) x += 1; if (b(12)) y -= 1; if (b(13)) y += 1;
      if (b(0)) { jump = true; confirm = true; }
      if (b(2) || b(1) || b(5) || b(7)) punch = true;
      if (b(2)) confirm = true;
      if (b(9)) pause = true;
      if ((b(0) || b(2) || b(9)) && onGesture) onGesture();
      break;
    }
    if (touch.active) {
      if (abs(touch.x) > 0.3) x += sign(touch.x);
      if (abs(touch.y) > 0.5) y += sign(touch.y);
      jump = jump || touch.jump; punch = punch || touch.punch; pause = pause || touch.pause;
      confirm = confirm || touch.punch || touch.jump;
    }
    x = clamp(x, -1, 1); y = clamp(y, -1, 1);
    const cur = { jump, punch, pause, confirm, mute, up: y < 0, down: y > 0, left: x < 0, right: x > 0 };
    st.x = x; st.y = y; st.jump = jump; st.punch = punch;
    st.jumpP = jump && !prev.jump; st.punchP = punch && !prev.punch; st.punchR = !punch && !!prev.punch;
    st.pauseP = pause && !prev.pause; st.confirmP = confirm && !prev.confirm; st.muteP = mute && !prev.mute;
    st.upP = cur.up && !prev.up; st.downP = cur.down && !prev.down; st.leftP = cur.left && !prev.left; st.rightP = cur.right && !prev.right;
    Object.assign(prev, cur);
    touch.pause = false;
  }
  return { st, poll, touch, keys, setGesture(fn) { onGesture = fn; }, get padSeen() { return padSeen; }, gesture() { if (onGesture) onGesture(); } };
})();

// ===== 10_audio.js
// ───────────────────────────── audio: synthesised SFX + a little dockside band
// All tunes are traditional (public domain). Hornpipe settings follow
// Ryan's Mammoth Collection (1883); "Drunken Sailor" is the usual capstan shanty.
const Sfx = (() => {
  let ac = null, master, sfx, music, leadBus, noiseBuf;
  const vol = { music: Store.get('vMusic', 0.6), sfx: Store.get('vSfx', 0.85) };
  let muted = Store.get('muted', false);
  const last = {};
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.18;
    master.connect(comp); comp.connect(ac.destination);
    sfx = ac.createGain(); sfx.connect(master);
    music = ac.createGain(); music.connect(master);
    leadBus = ac.createBiquadFilter(); leadBus.type = 'lowpass'; leadBus.frequency.value = 2600; leadBus.Q.value = 0.6;
    leadBus.connect(music);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVol();
    setInterval(tick, 25);
  }
  function applyVol() {
    if (!ac) return;
    master.gain.value = muted ? 0 : 1;
    sfx.gain.value = vol.sfx; music.gain.value = vol.music * 0.5;
  }
  function tone(type, f0, f1, t, dur, peak, dest, att) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + (att || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfx); o.start(t); o.stop(t + dur + 0.05);
    return o;
  }
  function hiss(t, dur, peak, type, f0, f1, q, dest, att) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = type || 'lowpass';
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    f.Q.value = q || 0.8;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + (att || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || sfx);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  }
  // rate-limit so pile-ups don't turn into a wall of noise
  function ok(name, gap) {
    if (!ac) return false;
    const t = ac.currentTime;
    if (last[name] && t - last[name] < (gap || 0.04)) return false;
    last[name] = t; return true;
  }
  const P = {
    punch(p = 1) {
      if (!ok('punch', 0.03)) return; const t = ac.currentTime, v = clamp(0.35 + p * 0.25, 0.3, 1);
      tone('sine', 190 + 40 * p, 48, t, 0.16 + 0.04 * p, 0.9 * v);
      hiss(t, 0.07 + 0.03 * p, 0.8 * v, 'lowpass', 2600, 500, 0.7);
      tone('square', 110, 60, t, 0.06, 0.25 * v);
      if (p > 1.5) { hiss(t, 0.3, 0.5, 'bandpass', 900, 200, 0.6); tone('sawtooth', 70, 35, t, 0.3, 0.5); }
    },
    whoosh(p = 1) { if (!ok('whoosh', 0.05)) return; const t = ac.currentTime; hiss(t, 0.14, 0.22 * p, 'bandpass', 500, 2400, 1.4, null, 0.05); },
    wind(c) { if (!ok('wind', 0.11)) return; const t = ac.currentTime; tone('triangle', 300 + c * 420, 340 + c * 500, t, 0.1, 0.12, null, 0.02); },
    wood(v = 1) {
      if (!ok('wood', 0.05)) return; const t = ac.currentTime; v = clamp(v, 0.15, 1);
      tone('sine', 230, 120, t, 0.09, 0.7 * v); tone('triangle', 520, 300, t, 0.05, 0.3 * v);
      hiss(t, 0.05, 0.4 * v, 'bandpass', 1100, 600, 2);
    },
    metal(v = 1, low) {
      if (!ok('metal', 0.06)) return; const t = ac.currentTime; v = clamp(v, 0.15, 1);
      const f = (low ? 95 : 250) * rand(0.92, 1.1), dur = low ? 1.1 : 0.6;
      [1, 2.76, 5.4, 8.93].forEach((r, i) => tone(i ? 'sine' : 'triangle', f * r, f * r * 0.995, t, dur / (1 + i * 0.6), (0.4 * v) / (1 + i * 0.7)));
      hiss(t, 0.04, 0.35 * v, 'highpass', 2500, 0, 0.7);
    },
    crumple(v = 1) {
      if (!ok('crumple', 0.09)) return; const t = ac.currentTime; v = clamp(v, 0.2, 1);
      tone('sawtooth', 130, 42, t, 0.42, 0.3 * v, null, 0.02);
      tone('square', 61, 38, t + 0.03, 0.5, 0.22 * v, null, 0.03);
      hiss(t, 0.35, 0.3 * v, 'bandpass', 1800, 240, 3, null, 0.02);
    },
    creak() { if (!ok('creak', 0.2)) return; const t = ac.currentTime; hiss(t, 0.4, 0.2, 'bandpass', 500, 900, 14, null, 0.1); tone('sawtooth', 95, 140, t, 0.4, 0.07, null, 0.1); },
    bell() {
      if (!ok('bell', 0.3)) return; const t = ac.currentTime, f = 620;
      [1, 2.0, 2.98, 4.2, 5.43].forEach((r, i) => tone('sine', f * r, f * r, t, 2.2 / (1 + i * 0.5), 0.34 / (1 + i)));
      tone('square', f * 2, f * 2, t, 0.03, 0.2);
    },
    splash(v = 1) {
      if (!ok('splash', 0.08)) return; const t = ac.currentTime;
      hiss(t, 0.5, 0.6 * v, 'bandpass', 2400, 350, 0.7, null, 0.02);
      tone('sine', 150, 55, t, 0.25, 0.5 * v); hiss(t + 0.1, 0.6, 0.2 * v, 'highpass', 4000, 0, 0.5, null, 0.1);
    },
    hurt() { if (!ok('hurt', 0.1)) return; const t = ac.currentTime; tone('square', 520, 140, t, 0.22, 0.3); tone('sawtooth', 260, 70, t, 0.22, 0.25); hiss(t, 0.1, 0.5, 'lowpass', 1800, 400); },
    ko() { if (!ok('ko', 0.12)) return; const t = ac.currentTime; tone('sine', 1500, 320, t, 0.55, 0.22, null, 0.03); tone('triangle', 1504, 322, t, 0.55, 0.1, null, 0.03); },
    launch(p = 1) { if (!ok('launch', 0.1)) return; const t = ac.currentTime; tone('sine', 380, 1500 + 500 * p, t, 0.32, 0.2, null, 0.03); },
    boing(v = 1) {
      if (!ok('boing', 0.09)) return; const t = ac.currentTime;
      const o = tone('sine', 110, 190, t, 0.45, 0.3 * clamp(v, 0.2, 1), null, 0.01);
      const l = ac.createOscillator(), g = ac.createGain(); l.frequency.value = 22; g.gain.value = 40;
      l.connect(g); g.connect(o.frequency); l.start(t); l.stop(t + 0.5);
    },
    glass() { if (!ok('glass', 0.05)) return; const t = ac.currentTime; hiss(t, 0.22, 0.45, 'highpass', 5200, 0, 1); [2100, 3300, 4700].forEach((f, i) => tone('sine', f * rand(0.9, 1.1), f, t + i * 0.012, 0.12, 0.12)); },
    foomp() { if (!ok('foomp', 0.2)) return; const t = ac.currentTime; tone('sine', 75, 240, t, 0.2, 0.9, null, 0.01); hiss(t, 0.45, 0.7, 'lowpass', 500, 3000, 0.8, null, 0.03); },
    toot() {
      if (!ok('toot', 0.5)) return; const t = ac.currentTime;
      [[0, 0.16], [0.21, 0.42]].forEach(([d, len]) => {
        [932, 1109].forEach((f) => { const o = tone('sawtooth', f * 0.97, f, t + d, len, 0.14, null, 0.02); o.detune.value = rand(-6, 6); });
        hiss(t + d, len, 0.14, 'bandpass', 3200, 3400, 3, null, 0.02);
      });
      [58, 62, 65, 70, 74, 77, 82].forEach((m, i) => tone('square', mtof(m + 12), mtof(m + 12), t + 0.62 + i * 0.045, 0.14, 0.11));
    },
    powerdown() { if (!ok('pd', 0.5)) return; const t = ac.currentTime; tone('sawtooth', 700, 120, t, 0.6, 0.16, null, 0.03); },
    can() { if (!ok('can', 0.1)) return; const t = ac.currentTime; tone('square', 1200, 1250, t, 0.04, 0.2); tone('triangle', 500, 220, t + 0.02, 0.1, 0.3); },
    blip(hi) { if (!ok('blip', 0.03)) return; const t = ac.currentTime; tone('square', hi ? 880 : 620, hi ? 1320 : 620, t, 0.07, 0.13); },
    stamp() { if (!ok('stamp', 0.06)) return; const t = ac.currentTime; tone('sine', 140, 60, t, 0.12, 0.7); hiss(t, 0.05, 0.4, 'lowpass', 1500, 300); },
    coin() { if (!ok('coin', 0.05)) return; const t = ac.currentTime; tone('square', 1319, 1319, t, 0.06, 0.1); tone('square', 1760, 1760, t + 0.06, 0.16, 0.1); },
    gull() { if (!ok('gull', 0.6)) return; const t = ac.currentTime; [0, 0.17, 0.33].forEach((d) => tone('sawtooth', 1500, 1050, t + d, 0.13, 0.05, null, 0.02)); },
    thunder() { if (!ok('thunder', 1)) return; const t = ac.currentTime; hiss(t, 2.2, 0.55, 'lowpass', 400, 60, 0.6, null, 0.04); tone('sine', 60, 30, t, 1.2, 0.5, null, 0.02); },
    whistle() { if (!ok('whistle', 0.4)) return; const t = ac.currentTime; tone('sine', 1900, 2500, t, 0.5, 0.12, null, 0.05); },
    step() { if (!ok('step', 0.12)) return; const t = ac.currentTime; hiss(t, 0.035, 0.1, 'bandpass', 700, 400, 1.5); },
    chain(n) { if (!ok('chain', 0.03)) return; const t = ac.currentTime; const m = 70 + [0, 2, 4, 7, 9, 12, 14, 16, 19][clamp(n, 0, 8)]; tone('triangle', mtof(m), mtof(m), t, 0.12, 0.16); },
  };

  // ── tune book
  function parseABC(s, keyAcc) {
    const out = [], base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    let i = 0, barAcc = {};
    while (i < s.length) {
      let ch = s[i];
      if (ch === '|') { barAcc = {}; i++; continue; }
      let acc = null;
      if (ch === '^' || ch === '_' || ch === '=') { acc = ch === '^' ? 1 : ch === '_' ? -1 : 0; ch = s[++i]; }
      const up = ch ? ch.toUpperCase() : '';
      if (base[up] !== undefined || ch === 'z') {
        let midi = null; i++;
        if (ch !== 'z') {
          let oct = ch === up ? 60 : 72;
          while (s[i] === "'") { oct += 12; i++; }
          while (s[i] === ',') { oct -= 12; i++; }
          if (acc !== null) barAcc[up] = acc;
          midi = oct + base[up] + (barAcc[up] !== undefined ? barAcc[up] : keyAcc[up] || 0);
        }
        let num = ''; while (s[i] >= '0' && s[i] <= '9') num += s[i++];
        out.push({ m: midi, d: num ? +num : 1 });
        continue;
      }
      i++;
    }
    return out;
  }
  function chord(name) {
    const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    let r = base[name[0]], q = name.slice(1);
    if (q[0] === 'b') { r--; q = q.slice(1); } else if (q[0] === '#') { r++; q = q.slice(1); }
    return { root: r, minor: q[0] === 'm' };
  }
  function mkTune(o) {
    const steps = [], chords = [];
    let pos = 0;
    for (const sec of o.form) {
      const part = o.parts[sec];
      for (const n of parseABC(part.abc, o.key)) { if (n.m !== null) (steps[pos] = steps[pos] || []).push(n); pos += n.d; }
      for (const c of part.ch) { const [a, b] = c.split('/'); chords.push([chord(a), chord(b || a)]); }
    }
    return { steps, chords, len: pos, pickup: o.pickup, bpm: o.bpm, swing: o.swing || 0, shift: o.shift || 0 };
  }
  const Bb = { B: -1, E: -1 }, F = { B: -1 }, D = { F: 1, C: 1 };

// ── ship's bell: ring it with a body (or a fist) to rattle every tough in earshot
class Bell {
  constructor(shape, i, dy) { this.s = shape; this.i = i; this.dy = dy; this.cd = 0; this.sw = 0; this.t = 0; }
  get x() { return this.s.pts[this.i].x; } get y() { return this.s.pts[this.i].y + this.dy; }

    if (this.cd > 0) return; this.cd = 1.4; this.sw = 1; Sfx.bell(); G.event('bell', { x: this.x, y: this.y });

  draw() {

    line([[x - 22, base.y], [x - 22, y - 26], [x + 2, y - 26]], 5); line([[x - 22, base.y], [x - 22, y - 26], [x + 2, y - 26]], 2, C.woodDk);
